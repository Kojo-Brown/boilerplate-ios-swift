name: CI

# Phase 0 item 3: `workflow-templates/ios-ci.yml` promoted into `.github/`, with
# `gates.yml` folded in. There is one CI workflow now, not a runnable one beside
# a template pretending to be one.
#
# The template is not preserved verbatim, because it could never have run. It
# named `-scheme boilerplate-ios-swift`, which does not exist — this is an SPM
# package, and xcodebuild synthesises the scheme names. It hardcoded
# `/Applications/Xcode_16.app`, a path the runner images do not carry. It pinned
# `OS=18.0` on the destination, a simulator runtime that is no longer installed.
# And its SwiftLint step printed "skipping" and exited 0 when swiftlint was
# absent, which is a check that cannot fail. `gates.yml` had already solved all
# four for real in item 2, so the promotion keeps those solutions and takes from
# the template the one thing it had that `gates.yml` did not: reading the
# coverage that the test run has been measuring and discarding.
#
# Two of the template's steps are deliberately dropped rather than carried over:
#
#   * The `.build` cache. `xcodebuild` builds into DerivedData and never reads
#     `.build`, so the cache stored nothing the build could use. Caching
#     DerivedData instead was considered and rejected — a warm cache lets a build
#     pass against sources it did not compile.
#
#   * The Codecov upload. It carried `fail_ci_if_error: false` and no token, so
#     it could only ever have been decorative. Coverage goes to the job summary
#     and the artifact bundle instead, which needs no third-party service and no
#     secret. Wiring up Codecov for real is a Phase 1 decision, not this item.
#
# Dependency resolution stays in its own workflow on purpose, so a package that
# has disappeared upstream reports as a resolution failure rather than as a wall
# of "no such module" errors here.
#
# CLAUDE.md asks for these gates to be run locally. They cannot be: the scheduled
# agent runs on Linux, where `swift`, `xcodebuild` and `swiftlint` do not exist
# and Xcode cannot be installed. This workflow is therefore the gate itself, not
# a transcript of a local run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # SwiftLint is syntactic — it needs no toolchain, no resolved packages and
      # no simulator, so it runs as its own job and reports even when the build
      # is broken.
      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      # `github-actions-logging` renders inline annotations on the PR diff, but it
      # writes only the message to the raw log — the file and line survive as
      # annotation metadata, which is unreadable to anything reading the log. So on
      # failure the violations are printed again through the `xcode` reporter,
      # which is `path:line:col: error: message (rule_id)`. Costs a second, and
      # only when the job is already red.
      - name: swiftlint --strict
        run: |
          if ! swiftlint lint --strict --reporter github-actions-logging; then
            echo '=== full violation list (path:line:col) ==='
            swiftlint lint --strict --reporter xcode || true
            exit 1
          fi

  build-and-test:
    name: Build and test on the iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md pins the project to Swift 6 / Xcode 16. Pick the newest Xcode
      # 16 present rather than a hardcoded point release, whose path changes as
      # the runner image is updated.
      - name: Select Xcode 16
        run: |
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 16 on this runner image; the project targets Swift 6."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Print tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      # This is an SPM package, not an `.xcodeproj`. CLAUDE.md's `-scheme App`
      # does not name anything here, and the old template's
      # `-scheme boilerplate-ios-swift` was equally invented. xcodebuild
      # synthesises one scheme per product plus a `<package>-Package` scheme
      # that is the only one carrying the test target, so pick that by name
      # instead of guessing.
      - name: Discover the scheme
        run: |
          xcodebuild -list
          scheme=$(xcodebuild -list -json | jq -r '
            [ (.workspace.schemes // .project.schemes // [])[] ] as $schemes
            | ( ($schemes | map(select(endswith("-Package"))) | first)
                // ($schemes | first)
                // empty )
          ')
          if [ -z "$scheme" ]; then
            echo "::error::xcodebuild reported no schemes for this package."
            exit 1
          fi
          echo "Using scheme: $scheme"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"

      # Pin to a concrete simulator UDID. A `name=iPhone 16` destination silently
      # resolves to whatever the image happens to ship, and fails opaquely when
      # that model is dropped from a runner image.
      #
      # The runner also carries simulator runtimes newer than the selected Xcode
      # can drive — it has iOS 26.x while Xcode 16.4 builds against the iOS 18.5
      # SDK. Taking the newest runtime unconditionally pairs an 18.5 SDK with a
      # 26.2 device, which xcodebuild accepts for building and then fails on when
      # it tries to run the tests. So candidates are capped at the SDK's major
      # version, and the newest runtime at or below it wins.
      #
      # The backstop and the retry are defensive, not a fix for a diagnosed
      # hang. What prompted them: on this branch's first run the step was still
      # going several minutes into work that took 43s on the last green run of
      # identical code, and that run was superseded before it finished, so
      # whether it would have completed is unknown. Unbounded is the problem
      # either way — the build and test steps each carry a step timeout
      # precisely so a stall fails as a named step while the job survives to
      # summarise and upload the logs, and this step was missed when those went
      # in. Left as it was, a wedged CoreSimulator holds the runner for the
      # job's full hour and then reports "cancelled", which names no command
      # and, because a cancelled job skips its remaining steps, uploads none of
      # the logs that would have.
      #
      # The retry restarts the service rather than re-asking a daemon that
      # already failed to answer, and covers only the device-list query:
      # nothing here can turn a failing build or a failing test into a pass.
      - name: Choose an iOS Simulator
        timeout-minutes: 10
        run: |
          sdk_major=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)
          echo "iphonesimulator SDK major version: $sdk_major"

          # macOS ships no coreutils `timeout`. perl is always present, its
          # alarm survives the exec, and SIGALRM's default action kills the
          # child — same effect, no dependency.
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; }

          devices=''
          for attempt in 1 2 3; do
            if devices=$(bounded 120 xcrun simctl list devices available --json); then
              break
            fi
            devices=''
            echo "::warning::simctl returned no device list (attempt $attempt); restarting CoreSimulator"
            sudo pkill -9 -f CoreSimulatorService 2>/dev/null || true
            bounded 60 xcrun simctl shutdown all || true
            sleep 15
          done
          if [ -z "$devices" ]; then
            echo "::error::simctl never returned a device list; CoreSimulator is wedged on this runner."
            exit 1
          fi

          # Render the listing from the JSON already in hand rather than calling
          # simctl a second time, so the log costs no extra chance to hang.
          printf '%s' "$devices" | jq -r '
            .devices
            | to_entries[]
            | select(.key | test("SimRuntime\\.iOS-"))
            | .key as $runtime
            | .value[]
            | select(.isAvailable)
            | "\($runtime)  \(.name)  \(.udid)"
          ' || true

          udid=$(printf '%s' "$devices" | jq -r --argjson sdk "$sdk_major" '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)")) as $v
              | .value[]
              | select(.isAvailable and (.name | startswith("iPhone")))
              | { version: [($v.major | tonumber), ($v.minor | tonumber)],
                  name: .name,
                  udid: .udid }
            ]
            | map(select(.version[0] <= $sdk)) as $all
            | if ($all | length) == 0 then empty else
                ($all | map(.version) | max) as $newest
                | ($all | map(select(.version == $newest))) as $latest
                | ( ($latest | map(select(.name == "iPhone 16")) | first)
                    // ($latest | first) ).udid
              end
          ')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator available on this runner image."
            exit 1
          fi
          name=$(printf '%s' "$devices" | jq -r --arg u "$udid" '
            [ .devices[]?[]? | select(.udid == $u) | .name ] | first // "unknown"
          ')
          echo "Using simulator $name ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build for the iOS Simulator
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      # Phase 0 item 4. `xcodebuild` exits 0 with any number of warnings, so
      # until now "builds with no warnings" was unmeasured — the diagnostics were
      # printed into a 5,000-line log nobody reads and the job went green.
      #
      # This runs before the test step on purpose. It is a property of the
      # compile that has already happened, so there is nothing to gain by
      # spending 25 minutes on the simulator first, and a red build log is the
      # thing to fix either way.
      #
      # Passing `-warnings-as-errors` to xcodebuild was the other option and was
      # rejected: command-line build settings apply to every target in the
      # synthesised project, including `GoogleSignIn-iOS`, so a warning in a
      # dependency this repo does not control would fail the build with no fix
      # available. `.unsafeFlags` in Package.swift scopes correctly but makes the
      # package unusable as a dependency of any other package. Reading the log
      # scopes to this checkout exactly and costs nothing at build time.
      - name: Assert the build emitted no warnings
        run: python3 .github/scripts/assert-no-warnings.py build.log "$GITHUB_WORKSPACE"

      # `-test-timeouts-enabled` makes a test that never returns fail by name
      # instead of wedging the runner. Without it the first hang costs the full
      # job timeout and reports as "cancelled", which says nothing about which
      # test hung — and because a cancelled job skips its remaining steps, the
      # logs that would have said so are never uploaded.
      #
      # The step timeout is the backstop for a hang that the allowance cannot
      # see (a wedged simulator, a stuck xcodebuild). It is deliberately shorter
      # than the job's, so the step fails while the job lives on to run the
      # summary and upload the logs.
      - name: Run the test suite
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      # Xcode 16 moved the .xcresult readers behind `--legacy` and made the bare
      # form an error rather than a warning, but which point release did that
      # varies, so try the current spelling and fall back rather than pinning to
      # one of them. A failure to read the report is a hard failure: the
      # template's `|| true` here meant a broken extraction printed nothing and
      # still reported success, which is worse than not measuring at all.
      - name: Export code coverage
        run: |
          if ! xcrun xccov view --report --json TestResults.xcresult > coverage.json 2> xccov.err; then
            echo "xccov rejected the modern invocation, retrying with --legacy:"
            cat xccov.err
            xcrun xccov view --report --json --legacy TestResults.xcresult > coverage.json
          fi
          python3 .github/scripts/summarise-coverage.py coverage.json

      # xcodebuild buries a handful of diagnostics in thousands of lines, most of
      # it a single multi-kilobyte `swift-frontend` invocation it echoes on
      # failure. Pull the lines that actually say what broke to the end of the
      # log, where anyone reading a red run looks first.
      - name: Summarise failures
        if: failure()
        run: |
          for log in build.log test.log; do
            [ -f "$log" ] || continue
            echo "::group::$log — errors and failures"
            grep -E '(^|[[:space:]])(error|fatal error):|\*\* .* FAILED \*\*|^Testing failed:|failed \([0-9]|^ld: |Undefined symbol|building for .* but linking|does not contain|missing architecture|exceeded execution time allowance|Test Case .* (failed|timed out)' "$log" \
              | grep -v '^[[:space:]]*/Applications/Xcode' \
              | sort -u \
              || echo "(no error lines matched; see the uploaded $log)"
            echo "::endgroup::"
            # A hang leaves no error line at all — the last thing the log says is
            # the test that started and never finished, so print the tail too.
            echo "::group::$log — last 40 lines"
            tail -40 "$log"
            echo "::endgroup::"
          done

      # When the test process dies rather than failing an assertion, xcodebuild
      # reports every test that had not finished as "failing" and says nothing
      # about why the process went away. The crash report does, and it is written
      # to the host's DiagnosticReports directory — not into the .xcresult — so
      # without this step it is discarded with the runner.
      - name: Collect crash reports
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for dir in ~/Library/Logs/DiagnosticReports "$HOME/Library/Logs/CoreSimulator/$SIMULATOR_UDID"; do
            [ -d "$dir" ] || continue
            for report in "$dir"/*.ips "$dir"/*.crash; do
              case "$(basename "$report")" in
                xctest*|ViewModelTests*|testmanagerd*) ;;
                *) continue ;;
              esac
              found=1
              echo "::group::$(basename "$report")"
              # An .ips is a JSON header line followed by a JSON payload. Dumping
              # raw bytes is useless: the register dump for one thread runs to
              # tens of kilobytes and pushes out the two things that matter — the
              # Swift runtime's fatal-error message, which the payload carries in
              # `asi`, and the faulting thread's symbolicated frames.
              python3 .github/scripts/summarise-crash-report.py "$report"
              echo "::endgroup::"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "No xctest crash report found — the process did not crash, or the report went elsewhere."
            ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null || true
          fi

      # Both logs, always: a red run is only useful if the compiler and test
      # output survive it.
      - name: Upload build and test logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-logs-${{ github.run_number }}
          path: |
            build.log
            test.log
            coverage.json
            TestResults.xcresult
          retention-days: 14
