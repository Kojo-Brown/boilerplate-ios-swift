name: Gates

# Phase 0 item 2: build, SwiftLint (strict), and the XCTest suite.
#
# CLAUDE.md asks for these to be run locally. They cannot be: the scheduled
# agent runs on Linux, where `swift`, `xcodebuild` and `swiftlint` do not exist
# and Xcode cannot be installed. `download.swift.org` and Docker Hub's blob CDN
# are both refused by the agent's egress policy (403 on CONNECT), so even a
# Linux Swift toolchain — which still could not build for iOS — is out of reach.
# This workflow is therefore the source of truth for these three gates, the same
# conclusion item 1 reached for dependency resolution.
#
# Dependency resolution deliberately lives in its own workflow. Keeping it apart
# means a broken dependency graph still reports as a broken dependency graph
# rather than as a wall of compiler errors here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than taken from the runner image, whose preinstalled SwiftLint
  # moves without notice — a lint gate that changes rule set under you is not a
  # gate. Bumping this is a deliberate commit, and the checksum has to move with it.
  SWIFTLINT_VERSION: "0.59.1"
  SWIFTLINT_SHA256: "58f9be8a4677900c945e2c618168223f4dd620a0cc65c9ccc5ea0f70433e89c1"

jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          curl -fsSL -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -q portable_swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Print SwiftLint version
        run: swiftlint version

      # --strict promotes every warning to an error, which is what CLAUDE.md
      # specifies. `lint` (not `analyze`) is correct here: the rule set in
      # .swiftlint.yml deliberately contains no analyzer rules, so no compiler
      # log is needed and lint can run without waiting on the build job.
      # The github-actions-logging reporter puts file and line into the PR
      # annotations but not into the plain job log, which makes a failed run
      # unreadable from the log alone. On failure, re-run with the xcode reporter
      # so the log carries `path:line:col` too. Linting this package takes ~3s,
      # so the second pass is cheaper than a round trip to find out where.
      - name: SwiftLint --strict
        run: |
          if ! swiftlint lint --strict --no-cache --reporter github-actions-logging; then
            echo "--- violations with file and line ---"
            swiftlint lint --strict --no-cache --reporter xcode || true
            exit 1
          fi

  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    # Resolution pulls ML Kit's xcframework binaries, which are large; a first
    # cold build on top of that is slow but finite. Anything near this ceiling
    # means the job is wedged, and a wedged job should fail rather than hold a
    # runner for the six-hour default.
    timeout-minutes: 60

    env:
      # The scheme Xcode derives for a Package.swift is named after the *package*
      # (`name:` in the manifest), not after the library product. `xcodebuild -list`
      # on this package reports exactly one scheme, and this is it.
      SCHEME: boilerplate-ios-swift
      SIMULATOR_NAME: iPhone 16

    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md pins the project to Swift 6 / Xcode 16. Pick the newest Xcode 16
      # on the image rather than a hardcoded point release, whose path changes as
      # the runner image is updated.
      - name: Select Xcode 16
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 16 on this runner image; the project targets Swift 6."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"

      # The x86_64 slice is the only simulator build ML Kit ships, and executing
      # x86_64 code on these Apple Silicon runners needs Rosetta, which the
      # macos-15 image does not preinstall. Without it the bundle links but every
      # test dies on an illegal instruction — the first run to get this far
      # reported "272 runs of 272 tests failed with Test crashed with signal ill."
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Print tool versions
        run: |
          swift --version
          xcodebuild -version

      # Diagnostic, not a gate. This is an SPM package with no .xcodeproj, so the
      # schemes are the ones Xcode derives from Package.swift. Printing them makes
      # a scheme-name mismatch legible instead of a bare "scheme not found".
      - name: List schemes and destinations
        run: xcodebuild -list

      - name: Resolve Swift Package dependencies
        run: swift package resolve

      # Fail with the available device list rather than letting xcodebuild report
      # a generic "Unable to find a destination" several minutes into a build.
      - name: Locate the simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r --arg name "$SIMULATOR_NAME" \
              '[.devices | to_entries[] | select(.key | test("SimRuntime.iOS"))
                | .value[] | select(.name == $name) | .udid] | first // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available '$SIMULATOR_NAME' iOS simulator on this runner image."
            exit 1
          fi
          echo "Using $SIMULATOR_NAME ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Show available simulators
        if: failure()
        run: xcrun simctl list devices available

      # The destination pins arch=x86_64, and that is load-bearing rather than
      # incidental. macos-15 runners are Apple Silicon, so this simulator resolves
      # to two destinations — arm64 and x86_64 — and xcodebuild picks arm64 first.
      # ML Kit ships no arm64 simulator slice: every one of its xcframeworks
      # advertises exactly `ios-arm64` (device) and `ios-x86_64-simulator`, which
      # is why the build emitted "missing architecture(s) required by this target
      # (arm64)" for MLKitTextRecognition, MLKitVision, MLImage and MLKitCommon.
      # Linking the test bundle for arm64 therefore cannot succeed while ML Kit is
      # a dependency. Selecting the x86_64 simulator uses the slice Google actually
      # publishes. The alternative is dropping ML Kit for Apple's Vision framework,
      # which is a product decision and not this item's to make.
      # -quiet, plus redirecting to a file and grepping on failure. xcodebuild
      # echoes every failing clang/swiftc invocation in full — single lines of
      # several thousand characters — which buried the actual error text so
      # deeply that the first failures were unreadable from the job log.
      - name: Build (iOS Simulator)
        run: |
          set -uo pipefail
          if ! xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,arch=x86_64,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "::group::Diagnostics"
            grep -E "error:|warning:|\*\* .+ \*\*" build.log || tail -40 build.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Run the XCTest suite
        run: |
          set -uo pipefail
          if ! xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,arch=x86_64,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "::group::Failures"
            grep -E "error:|failed|XCTAssert|\*\* .+ \*\*" test.log || tail -60 test.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Test result summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult || true
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14
